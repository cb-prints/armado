<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Display Lunish 3D</title>
<style>
:root{--bg:#eef0f2;--panel:#ffffff;--ink:#1d2329;--muted:#5d6670;--line:#d5d9de;--accent:#1f3a5f;--accent2:#0e8f8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#8fb8ff;--accent2:#2fc4bd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#8fb8ff;--accent2:#2fc4bd;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .dim{color:var(--muted)}
#stage{flex:1;position:relative;min-height:320px}
#stage canvas{display:block;width:100%;height:100%}
#caption{position:absolute;left:16px;right:16px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
#caption b{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
input[type=range]{flex:1;min-width:140px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#rec.on{background:#c62828;border-color:#c62828;color:#fff}
#msg{color:var(--muted);font-size:12px}
body.shot header,body.shot .bar,body.shot #caption{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="app">
<header><h1>Display Lunish Prebiotic Soda</h1><span class="dim" id="dims"></span></header>
<div id="stage"><div id="caption"></div></div>
<div class="bar">
  <button data-v="persp" class="on">3/4</button><button data-v="front">Frente</button><button data-v="side">Lateral</button><button data-v="back">Atrás</button><button data-v="top">Arriba</button>
  <span class="sep"></span>
  <button id="play">Armar ▶</button><input id="t" type="range" min="0" max="9" step="0.01" value="9">
  <button id="exp">Explosionada</button><button id="prod">Con latas</button>
  <span class="sep"></span>
  <button id="snap" title="Guardar la vista actual como PNG">Tomar imagen</button><button id="rec" title="Graba la animacion de armado completa desde la vista actual">● Grabar video</button><span id="msg" class="dim"></span>
</div>
</div>

  const ret=piv(dbl,xr-xd,0,0);ret.add(slab(B['ret'+s],xr,Y0,null,T/2));
  const top=piv(side,0,YT-Y0,0);top.add(slab(B['top'+s],xh,YT,null,T/2));
  const flap=piv(top,0,YF-YT,0);flap.add(slab(B['flap'+s],xh,YF,null,T/2));
  return {side,dbl,ret,top,flap,sgn};}
const SL=sideChain('L',-1),SR=sideChain('R',1);

// ---------------- P02 bandejas
const TR=DATA.tray,mid=DATA.tray_mid,yfl=M.T_Y[1],ylt=M.T_Y[2],ybr=M.T_Y[3],fx=M.T_FLAP_X;
const ZF=T/2+M.D_SIDE, ZLIP=ZF-DATA.slot_c+M.BRIDGE/2, DROP=N.tray.notch_h;
function trayMake(){const w=new THREE.Group();w.rotation.x=Math.PI/2;scene.add(w);
  const r=new THREE.Group();w.add(r);r.add(slab(TR.floor,mid,yfl));
  const fl=piv(r,fx[0]-mid,0,-T/2);fl.add(slab(TR.flapL,fx[0],yfl,null,T/2));
  const fr=piv(r,fx[1]-mid,0,-T/2);fr.add(slab(TR.flapR,fx[1],yfl,null,T/2));
  const lip=piv(r,0,0,-T/2);lip.add(slab(TR.lip,mid,yfl,['labio',DATA.lip_tex],T/2));lip.add(slab(TR.ears,mid,yfl,null,T/2));
  const br=piv(lip,0,ylt-yfl,0);br.add(slab(TR.bridge,mid,ylt,null,T/2));
  const rt=piv(br,0,ybr-ylt,0);rt.add(slab(TR.ret,mid,ybr,null,T/2));
  return {w,fl,fr,lip,br,rt};}
const TRAYS=N.shelf_z.map(()=>trayMake());

// ---------------- latas (producto estimado)
const CANS=new THREE.Group();scene.add(CANS);
{const c=N.cans,cols=[0xe8463c,0x7a3fa0,0xf39a1e,0x4fb848,0x2f9fd8,0xf2c230],geo=new THREE.CylinderGeometry(c.d/2,c.d/2,c.h,28);
 const z0=ZLIP-M.BRIDGE-T/2-0.08;let k=0;
 N.shelf_z.forEach(z=>{for(let i=0;i<c.cols;i++)for(let j=0;j<c.rows;j++){const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:cols[(k++)%cols.length],roughness:0.35,metalness:0.5}));
   m.position.set((i-(c.cols-1)/2)*c.d,z+T+c.h/2,z0-c.d/2-j*c.d);m.castShadow=true;CANS.add(m);}});}
CANS.visible=q.get('prod')==='1';

// ---------------- P03 cabezal
const hb=DATA.head_bb,head=new THREE.Group();scene.add(head);
head.add(slab(DATA.head.head,(hb[0]+hb[2])/2,hb[1],['cabezal',hb]));

const STEPS=["<b>1.</b> Cuerpo P01: doblar las solapas superiores 180° y los laterales 90° (la lengüeta de la solapa entra en la espalda).",
 "<b>2.</b> Doblar 180° el retorno del frente y encastrar la cola de milano con la solapa (sin pegamento).",
 "<b>3.</b> Bandejas P02 (x5): subir el labio, doblarlo 180° por el puente con las lengüetas del retorno en el piso, y subir las aletas laterales.",
 "<b>4.</b> Bandeja 1 (abajo): cabezas traseras por las ventanas de la espalda, orejas del labio por las ranuras de los laterales, bajar 0.87 in para trabar.",
 "<b>5.</b> Bandeja 2: igual.","<b>6.</b> Bandeja 3: igual.","<b>7.</b> Bandeja 4: igual.","<b>8.</b> Bandeja 5 (arriba): igual.",
 "<b>9.</b> Cabezal P03: bajarlo pegado a la espalda, detrás de las solapas; sus muescas traban las lengüetas traseras de las solapas.",
 "<b>Armado</b> · 7 piezas de una hoja 83 x 50 in, sin pegamento."];
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
let EXP=q.get('explode')==='1';
function setT(t){const ph=k=>ease(Math.min(1,Math.max(0,t-k)));
  const a=ease(Math.min(1,Math.max(0,t-0.5))),b=ph(1),f=ph(2);
  const b1=ease(Math.min(1,Math.max(0,t*2))),b2=ease(Math.min(1,Math.max(0,(t-1.5)*2)));  // solapa en plano, laterales (lengueta a la espalda), retorno (cola de milano)
  for(const S of[SL,SR]){S.side.rotation.y=S.sgn*Math.PI/2*a;
    S.dbl.rotation.y=S.sgn*Math.PI/2*b2;S.ret.rotation.y=S.sgn*Math.PI/2*b2;
    S.top.rotation.x=-Math.PI/2*b1;S.flap.rotation.x=-Math.PI/2*b1;}
  TRAYS.forEach((tr,k)=>{tr.fl.rotation.y=-Math.PI/2*f;tr.fr.rotation.y=Math.PI/2*f;tr.lip.rotation.x=-Math.PI/2*f;tr.br.rotation.x=-Math.PI/2*f;tr.rt.rotation.x=-Math.PI/2*f;
    const z=N.shelf_z[k],s=Math.min(1,Math.max(0,t-(3+k)));tr.w.visible=t>2;
    const mv=ease(Math.min(1,s/0.7)),dr=ease(Math.max(0,(s-0.7)/0.3));
    tr.w.position.set(0,z+DROP*(1-dr),ZLIP+26*(1-mv));
    if(EXP&&t>=TEND)tr.w.position.z=ZLIP+16+k*3;});
  head.visible=t>7.9;const hs=ease(Math.min(1,Math.max(0,t-8)));
  head.position.set(0,H-M.HD_INS_H+20*(1-hs)+(EXP&&t>=TEND?12:0),2*T);
  CANS.visible=(q.get('prod')==='1'||PROD)&&t>=TEND&&!EXP;
  document.getElementById('caption').innerHTML=EXP&&t>=TEND?"<b>Vista explosionada</b> · P01 x1, P02 x5, P03 x1":STEPS[Math.min(9,Math.floor(t+1e-6))];}
const TG=[0,28,6];
const VIEWS={persp:[66,50,110],front:[0,30,128],side:[128,30,6],back:[0,30,-122],top:[0,140,6.01],tres:[-74,54,112],lejos:[92,62,165,0,26,20],
  detalle:[26,46,34,7,38.5,9],trasera:[-20,46,-26,-3,38.5,0],traba:[3,53,24,-7.2,46,10],trabacab:[2,52,4,-7.4,45.6,-1.5]};
function view(v){const p=VIEWS[v]||VIEWS.persp;const s=EXP?1.3:1;const tg=p.length>3?p.slice(3):TG;cam.position.set(p[0]*s,p[1]*s,p[2]*s+(EXP?10:0));ctl.target.set(tg[0],tg[1]+(EXP?2:0),tg[2]+(EXP?10:0));ctl.update();
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();brandBg(w,h);}
addEventListener('resize',size);size();
let PROD=false;
const tEl=document.getElementById('t');let playing=false,last=0;
tEl.oninput=()=>{playing=false;setT(+tEl.value);};
document.getElementById('play').onclick=()=>{playing=!playing;if(playing&&+tEl.value>=TEND)tEl.value=0;document.getElementById('play').textContent=playing?'Pausa ❚❚':'Armar ▶';};
document.getElementById('exp').onclick=e=>{EXP=!EXP;e.target.classList.toggle('on',EXP);tEl.value=TEND;setT(TEND);view('persp');};
document.getElementById('prod').onclick=e=>{PROD=!PROD;e.target.classList.toggle('on',PROD);setT(+tEl.value);};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
// ---------------- tomar imagen y grabar video
const msg=t=>{document.getElementById('msg').textContent=t;};
let DL=null;const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').then(d=>DL=d).catch(()=>null):Promise.resolve(null);
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
async function offer(blob,name){
  await dlP;
  if(DL){try{await DL.save({filename:name,data:blob});msg('Guardado: '+name);}
    catch(e){msg(e&&e.code==='declined'?'Descarga cancelada':'No se pudo guardar ('+(e&&e.code||'error')+')');}return;}
  if(window.claude){msg('Esta vista no permite descargar archivos');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg('Guardado: '+name);}
document.getElementById('snap').onclick=()=>{renderer.render(scene,cam);
  renderer.domElement.toBlob(b=>b?offer(b,`Lunish_display_${stamp()}.png`):msg('No se pudo capturar'),'image/png');};
let REC=null;
function stopRec(){if(REC&&REC.state!=='inactive')REC.stop();}
document.getElementById('rec').onclick=()=>{
  if(REC&&REC.state==='recording'){stopRec();return;}
  if(!window.MediaRecorder||!renderer.domElement.captureStream){msg('Este navegador no puede grabar video');return;}
  const types=['video/mp4;codecs=avc1','video/mp4;codecs=avc1.42E01E','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const ext=mime.startsWith('video/mp4')?'mp4':'webm';
  const chunks=[];REC=new MediaRecorder(renderer.domElement.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:8e6}:{});
  REC.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  REC.onstop=()=>{const b=document.getElementById('rec');b.classList.remove('on');b.textContent='● Grabar video';ONREC=false;
    offer(new Blob(chunks,{type:mime||'video/webm'}),`Lunish_armado_${stamp()}.${ext}`);};
  EXP=false;document.getElementById('exp').classList.remove('on');
  tEl.value=0;setT(0);REC.start(250);ONREC=true;playing=true;
  const b=document.getElementById('rec');b.classList.add('on');b.textContent='■ Detener';document.getElementById('play').textContent='Pausa ❚❚';msg('Grabando el armado…');};
let ONREC=false;

const t0=q.get('step')!=null?+q.get('step'):TEND;tEl.value=t0;setT(t0);view(q.get('view')||'persp');
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(playing){let t=+tEl.value+dt*0.6;if(t>=TEND){t=TEND;playing=false;document.getElementById('play').textContent='Armar ▶';if(ONREC)setTimeout(stopRec,1500);}tEl.value=t;setT(t);}
  ctl.update();renderer.render(scene,cam);if(pending===0)window.__ready=true;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
<script>(function(){if(new URLSearchParams(location.search).get('auto')==='0')return;addEventListener('load',function(){setTimeout(function(){var b=document.getElementById('play')||document.getElementById('bPlay')||document.getElementById('aPlay');if(b)b.click();},1200);});})();</script>
