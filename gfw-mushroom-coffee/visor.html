<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFW Floor Display 3D</title>
<style>
:root{--bg:#eef0f2;--panel:#ffffff;--ink:#1d2329;--muted:#5d6670;--line:#d5d9de;--accent:#5a2a10;--accent2:#0e8f8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#f0b27a;--accent2:#2fc4bd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#f0b27a;--accent2:#2fc4bd;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .dim{color:var(--muted)}
#stage{flex:1;position:relative;min-height:320px}
#stage canvas{display:block;width:100%;height:100%}
#caption{position:absolute;left:16px;right:16px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
#caption b{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
input[type=range]{flex:1;min-width:140px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#rec.on{background:#c62828;border-color:#c62828;color:#fff}
#msg{color:var(--muted);font-size:12px}
body.shot header,body.shot .bar,body.shot #caption{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="app">
<header><h1>Floor display GFW Mushroom Coffee</h1><span class="dim" id="dims"></span></header>
<div id="stage"><div id="caption"></div></div>
<div class="bar">
  <button data-v="persp" class="on">3/4</button><button data-v="front">Frente</button><button data-v="side">Lateral</button><button data-v="back">Atrás</button><button data-v="top">Arriba</button>
  <span class="sep"></span>
  <button id="play">Armar ▶</button><button id="spd">1x</button><input id="t" type="range" min="0" max="10" step="0.01" value="10">
  <button id="exp">Explosionada</button>
  <span class="sep"></span>
  <button id="snap" title="Guardar la vista actual como PNG">Tomar imagen</button><button id="rec" title="Graba la animación de armado completa desde la vista actual">● Grabar video</button><span id="msg"></span>
</div>
</div>

  EXP=false;document.getElementById('exp').classList.remove('on');
  tEl.value=0;setT(0);REC.start(250);ONREC=true;playing=true;
  const b=document.getElementById('rec');b.classList.add('on');b.textContent='■ Detener';document.getElementById('play').textContent='Pausa ❚❚';msg('Grabando el armado…');};

const t0=q.get('step')!=null?+q.get('step'):TEND;tEl.value=t0;setT(t0);view(q.get('view')||'persp');
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(playing){let t=+tEl.value+dt*0.55*SPD;if(t>=TEND){t=TEND;playing=false;document.getElementById('play').textContent='Armar ▶';if(ONREC)setTimeout(stopRec,1500);}tEl.value=t;setT(t);}
  ctl.update();renderer.render(scene,cam);if(pending===0)window.__ready=true;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
<script>(function(){if(new URLSearchParams(location.search).get('auto')==='0')return;addEventListener('load',function(){setTimeout(function(){var b=document.getElementById('play')||document.getElementById('bPlay')||document.getElementById('aPlay');if(b)b.click();},1200);});})();</script>
</body>
