<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Armado GFW Mushroom Coffee Floor Display</title><meta name="description" content="Animacion 3D del armado de GFW Mushroom Coffee Floor Display, paso a paso.">
<style>:root{--bg:#f4f5f7;--panel:#ffffff;--ink:#16191d;--muted:#5d6670;--line:#dde1e5;--brand:#c8102e;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--brand:#ff5a6e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--brand:#ff5a6e;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
.marca{font-weight:800;letter-spacing:.08em;color:var(--brand);white-space:nowrap}
.tit{min-width:0}.tit h1{font-size:16px;margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tit p{margin:0;font-size:12px;color:var(--muted)}
body{display:flex;flex-direction:column}iframe{flex:1;width:100%;border:0;display:block}</style></head>
<body><header><span class="marca">CB PRINTS</span><div class="tit"><h1>GFW Mushroom Coffee Floor Display</h1><p>Instrucciones de armado paso a paso</p></div></header>
<iframe src="visor.html" title="Animación 3D del armado" allow="fullscreen"></iframe></body></html>
