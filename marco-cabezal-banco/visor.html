<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marco cabezal y banco</title>
<style>
:root{--bg:#eef0f2;--panel:#ffffff;--ink:#1d2329;--muted:#5d6670;--line:#d5d9de;--accent:#c8102e;--accent2:#0b7a3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#ff5a6e;--accent2:#3fcf7f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#ff5a6e;--accent2:#3fcf7f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .dim{color:var(--muted)}
#stage{flex:1;position:relative;min-height:320px}
#stage canvas{display:block;width:100%;height:100%}
#caption{position:absolute;left:16px;right:16px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
#caption b{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
input[type=range]{flex:1;min-width:140px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
body.shot header,body.shot .bar,body.shot #caption{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="app">
<header><h1>Marco con cabezal, estante y banco</h1><span class="dim" id="dims"></span></header>
<div id="stage"><div id="caption"></div></div>
<div class="bar">
  <button data-v="persp" class="on">3/4</button><button data-v="front">Frente</button><button data-v="side">Lateral</button><button data-v="back">Atrás</button><button data-v="top">Arriba</button>
  <span class="sep"></span>
  <button id="play">Armar ▶</button><input id="t" type="range" min="0" max="8" step="0.01" value="8">
  <button id="exp">Explosionada</button><button id="cot" class="on">Cotas</button>
</div>
</div>

    k.r.forEach((rs,i)=>{const sg=new THREE.Group();sg.matrixAutoUpdate=false;
      sg.matrix.copy(i===0?basis([d[0],d[1],0],[0,0,g],[o[0],o[1],0],[p[0]-o[0]*T/2,p[1]-o[1]*T/2,-g*T/2]):basis([1,0,0],[0,0,-1],[0,1,0],[0,k.w[i-1]-T/2,T/2]));

const A=new THREE.Group();scene.add(A);
// ---------- columnas: tubo plegado con bisagras en el liner exterior
function flapMesh(f,zoff){const [a0,b0,a1,b1]=f.rect,w=a1-a0,h=b1-b0;const pv=new THREE.Group();
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,T*0.96),FLAPM);m.castShadow=true;
  if(f.axis==='amax'){pv.position.set(a1,(b0+b1)/2,zoff);m.position.set(-w/2,0,0);}
  else if(f.axis==='amin'){pv.position.set(a0,(b0+b1)/2,zoff);m.position.set(w/2,0,0);}
  else if(f.axis==='top'){pv.position.set((a0+a1)/2,b1,zoff);m.position.set(0,-h/2,0);}
  else {pv.position.set((a0+a1)/2,b0,zoff);m.position.set(0,h/2,0);}

function setFlap(pv,a){pv.rotation.set(0,0,0);const ax=pv.userData.axis;

// esquina de cada doblez en V: el liner exterior es continuo, no se ve nucleo (la costura queda atras, entre las 2 pestanas)
function cornerBox(parent,xc,zh){const m=new THREE.Mesh(new THREE.BoxGeometry(T+0.004,H,T+0.008),FACE);m.position.set(xc,H/2,zh+T/2);parent.add(m);}
function column(D,side){
  const root=new THREE.Group(),frame=new THREE.Group();root.add(frame);frame.matrixAutoUpdate=false;
  frame.matrix.copy(basis([0,0,1],[0,1,0],[side,0,0],[side*(P.XI+T/2),0,P.ZR]));
  const hinges=[],flaps=[];
  // F1 fijo; hacia adelante F2, F3a y pestana B; hacia atras F4, F3b y pestana A (costura a la mitad del costado exterior F3)
  const fw=[P.CD,P.CW,P.CD/2,P.FLG];let parent=frame;

    if(k===0){holder=frame;for(const r of rs)frame.add(slab(r,0));}
    else{const hg=new THREE.Group();hg.position.set(fw[k-1],0,k===1?-T/2:0);hg.userData.sg=-1;parent.add(hg);hinges.push(hg);cornerBox(parent,fw[k-1]-T/2+0.002,hg.position.z);
      const face=new THREE.Group();face.position.z=T/2;hg.add(face);for(const r of rs)face.add(slab(r,0));parent=hg;holder=face;}
    for(const f of D.flaps)if(f.face===k){const pv=flapMesh(f,0);holder.add(pv);flaps.push(pv);}
  });
  const bw=[0,-P.CW,-P.CD/2];parent=frame;
  D.back.forEach((rs,k)=>{const hg=new THREE.Group();hg.position.set(bw[k],0,k===0?-T/2:0);hg.userData.sg=1;parent.add(hg);hinges.push(hg);cornerBox(parent,bw[k]+T/2-0.002,hg.position.z);

// U largas: abajo (puente en el piso, sube) y arriba (puente al ras de la boca, baja), en el plano a UZ del costado exterior

  const g=placed([DATA.U01],top?basis([0,0,1],[0,-1,0],[-1,0,0],[cx,H,0]):basis([0,0,1],[0,1,0],[1,0,0],[cx,0,0]));g.userData={s,top};UPL.push(g);A.add(g);}
const PAN=placed([DATA.P01],basis([1,0,0],[0,1,0],[0,0,1],[0,0,P.ZP]));A.add(PAN);
const SH=placed([DATA.P02],basis([1,0,0],[0,0,1],[0,-1,0],[0,P.YS-T/2,0]));A.add(SH);

const TOP=placed([DATA.B01],basis([1,0,0],[0,0,1],[0,-1,0],[0,P.YB-T/2,0]));A.add(TOP);
const LEGS=[-1,1].map(s=>{const g=s<0?hemmed(DATA.B02,basis([0,0,1],[0,1,0],[-1,0,0],[-P.XL,0,0]),-1):hemmed(DATA.B09,basis([0,0,-1],[0,1,0],[1,0,0],[P.XL,0,0]),-1);A.add(g);return g;});
const APF=hemmed(DATA.B03,basis([1,0,0],[0,1,0],[0,0,1],[0,P.BL-P.AH,P.ZAF]),-1);A.add(APF);
const APR=placed([DATA.B04],basis([1,0,0],[0,1,0],[0,0,1],[0,P.BL-P.AH,P.ZAR]));A.add(APR);
const RIB=hemmed(DATA.B05,basis([0,0,1],[0,1,0],[-1,0,0],[0,0,0]),1);A.add(RIB);
const SBR=P.SB_X.map(x=>{const g=placed([DATA.B08],basis([0,0,1],[0,1,0],[-1,0,0],[x,0,0]));A.add(g);return g;});
const OVT=hemmed(DATA.B06,basis([1,0,0],[0,0,1],[0,-1,0],[0,P.YB+T/2+0.01,0]),1);A.add(OVT);
const OVS=hemmed(DATA.B07,basis([1,0,0],[0,0,1],[0,-1,0],[0,P.YS+T/2+0.01,0]),1);A.add(OVS);
// ---------- cotas
const cot=new THREE.Group();scene.add(cot);
function label(txt,pos){const c=document.createElement('canvas');c.width=256;c.height=96;const x=c.getContext('2d');x.fillStyle='rgba(255,255,255,0.92)';x.fillRect(0,0,256,96);

function dim(a,b,txt,off){const m=new THREE.LineBasicMaterial({color:0xc8102e,depthTest:false});const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),m);l.renderOrder=8;cot.add(l);
  for(const p of[a,b]){const t=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p.clone().sub(off),p.clone().add(off)]),m);t.renderOrder=8;cot.add(t);}
  label(txt,a.clone().add(b).multiplyScalar(0.5));}
dim(V3(-P.XO,H+5,P.ZF),V3(P.XO,H+5,P.ZF),`${P.W} in`,V3(0,1.5,0));
dim(V3(-P.XO-6,0,P.ZF),V3(-P.XO-6,H,P.ZF),`${H} in`,V3(1.5,0,0));
dim(V3(P.XO+6,0,P.ZR),V3(P.XO+6,0,P.BZ1),`${P.DEP} in`,V3(1.5,0,0));
dim(V3(P.XO+3,0,P.BZ1),V3(P.XO+3,P.YB,P.BZ1),`${P.YB} in`,V3(1.5,0,0));
dim(V3(-P.XI+4,P.YS,P.ZF+1),V3(-P.XI+4,0,P.ZF+1),`${P.YS} in`,V3(1.5,0,0));
let COT=q.get('cot')!=='0',EXP=q.get('explode')==='1';
const STEPS=["<b>1.</b> Plegar cada columna por sus dobleces en V: las 2 pestañas quedan espalda con espalda a la mitad del costado exterior (no se ve de frente ni de atrás). Por adentro del tubo, una U de 20 in sube desde abajo y otra baja desde arriba: abrazan las pestañas y su puente asienta a media madera (3 in) en las muescas.",
 "<b>2.</b> Columna izquierda parada. Panel bajo levantado 1.5 in: sus 3 ganchos entran en la columna (solapas turquesa) y se baja al piso. Por detrás, 4 ménsulas del estante enganchadas al panel.",
 "<b>3.</b> Estante: sus 2 arpones entran en la columna izquierda 1.5 in más arriba y se baja sobre las lengüetas del panel.",
 "<b>4.</b> Columna derecha levantada 1.5 in: entran los ganchos del panel y los arpones del estante (solapas abajo) y se baja al piso.",
 "<b>5.</b> Cabezal (2 personas): se baja desde arriba; sus 4 ganchos colgantes entran por arriba del tubo y asientan en las muescas.",
 "<b>6.</b> Patas del banco levantadas 1.5 in: 2 ganchos en el frente de cada columna y se bajan al piso; el faldón de cada pata dobla hacia el centro. Pata central: 2 ganchos al panel bajo.",
 "<b>7.</b> Faldón frontal (con dobladillo pegado abajo) y faldón trasero: se bajan sobre las 3 patas a media madera.",
 "<b>8.</b> Cubierta: llega hasta el panel bajo (sin luz), sus 4 lengüetas lo atraviesan y se baja; las lengüetas de los faldones de las patas la atraviesan. Encima, las tapas del banco y de la barra con su dobladillo pegado.",
 `<b>Armado</b> · ${P.W} x ${P.DEP} x ${H} in · columnas de una pieza ${P.CW} x ${P.CD} in · estante a ${P.YS} in · banco a ${P.YB} in · sin pegamento.`];
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x),cl=x=>Math.min(1,Math.max(0,x));
const off=(g,x,y,z)=>g.position.set(x,y,z);
function bump(p){return p>0&&p<1?1.15*Math.sin(Math.PI*p):0;}
function setT(t){
  const f=ease(cl(t/0.55));fold(C1,f*Math.PI/2);fold(C2,f*Math.PI/2);
  const c2=cl(t-3);off(C2,3*(1-ease(cl(c2/0.5))),TR*(1-ease(cl((c2-0.5)/0.5))),0);
  const ins=(g,t0,dy,dz)=>{const p=cl(t-t0);g.visible=t>t0;off(g,1.4*(1-ease(cl((p-0.45)/0.25))),dy*(1-ease(cl((p-0.7)/0.3))),dz*(1-ease(cl(p/0.45))));return p;};
  const pp=ins(PAN,1,TR,40),ps=ins(SH,2,TR,40);

    if(k===0){const isA=pv.userData.axis==='top'||pv.userData.axis==='bot';const p=isA?ps:pp;a=bump((p-0.45)/0.55);on=t>(isA?2:1)&&t<(isA?3:2);}
    else{const p=cl(t-5);a=bump((p-0.45)/0.55);on=t>5&&t<6;}
    setFlap(pv,a);pv.children[0].material=on?FLAPM:FACE;}
  for(const pv of C2.userData.flaps){const k=pv.userData.face;let a=0,on=false;
    if(k===0){a=bump(c2/1.0);on=t>3&&t<4;}else{const p=cl(t-5);a=bump((p-0.45)/0.55);on=t>5&&t<6;}
    setFlap(pv,a);pv.children[0].material=on?FLAPM:FACE;}
  SBR.forEach(g=>{const p=cl((t-1.55)/0.45);g.visible=t>1.55;off(g,0,TR*(1-ease(cl((p-0.7)/0.3))),-10*(1-ease(cl(p/0.6))));});
  UPL.forEach(g=>{const u=g.userData,t0=u.top?0.8:0.6,p=cl((t-t0)/0.2);g.visible=t>t0;
    off(g,u.s>0?C2.position.x:0,(u.s>0?C2.position.y:0)+(u.top?1:-1)*(P.UL+4)*(1-ease(p)),0);});

  LEGS.forEach(g=>{const p=cl(t-5);g.visible=t>5;off(g,0,TR*(1-ease(cl((p-0.7)/0.3))),14*(1-ease(cl(p/0.6))));});

  {const p=cl(t-7);RIB.visible=t>5.3;const r=cl((t-5.3)/0.7);off(RIB,0,TR*(1-ease(cl((r-0.7)/0.3))),12*(1-ease(cl(r/0.6))));
   TOP.visible=t>7;const pt=cl(p/0.6);off(TOP,0,T+16*(1-ease(cl(pt/0.5)))-T*ease(cl((pt-0.8)/0.2)),P.TTL*(1-ease(cl((pt-0.5)/0.3))));
   for(const g of[OVT,OVS]){g.visible=t>7.6;off(g,0,10*(1-ease(cl((p-0.6)/0.4))),0);}}

const VIEWS={persp:[150,105,215],front:[0,42,265],side:[265,42,10],back:[-20,46,-265],top:[0,300,0.01],paso:[150,95,190],flap:[2,26,-34],fold:[60,260,140],leg:[120,30,90],canto:[62,40,58],boca:[-52,100,4],tubo:[70,34,62],luz:[8,92,62],col:[48,45,40]};
function view(v){const p=VIEWS[v]||VIEWS.persp;const s=EXP?1.3:1;cam.position.set(p[0]*s,p[1]*s,p[2]*s);
  const tg={top:[0,0,6],flap:[-31,17,3],fold:[0,30,0],leg:[34,12,12],canto:[36,28,20],boca:[-37,80,0],tubo:[36,29,19],luz:[0,30,6],col:[35,45,4]}[v]||[0,H*0.48,4];ctl.target.set(...tg);ctl.update();
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}

const tEl=document.getElementById('t');let playing=false,last=0;

document.getElementById('play').onclick=()=>{playing=!playing;if(playing&&+tEl.value>=TEND)tEl.value=0;document.getElementById('play').textContent=playing?'Pausa ❚❚':'Armar ▶';};
document.getElementById('exp').onclick=e=>{EXP=!EXP;e.target.classList.toggle('on',EXP);tEl.value=TEND;setT(TEND);view('persp');};
document.getElementById('cot').onclick=e=>{COT=!COT;e.target.classList.toggle('on',COT);setT(+tEl.value);};

const t0=q.get('step')!=null?+q.get('step'):TEND;tEl.value=t0;setT(t0);view(q.get('view')||'persp');
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(playing){let t=+tEl.value+dt*0.4;if(t>=TEND){t=TEND;playing=false;document.getElementById('play').textContent='Armar ▶';}tEl.value=t;setT(t);}
