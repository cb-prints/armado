<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter Dolo-Pain 3D</title>
<style>
:root{--bg:#eef0f2;--panel:#ffffff;--ink:#1d2329;--muted:#5d6670;--line:#d5d9de;--accent:#1f3a5f;--accent2:#0e8f6a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#8fb8ff;--accent2:#2fc49a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#8fb8ff;--accent2:#2fc49a;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .dim{color:var(--muted)}
#stage{flex:1;position:relative;min-height:320px}
#stage canvas{display:block;width:100%;height:100%}
#caption{position:absolute;left:16px;right:16px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
#caption b{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
input[type=range]{flex:1;min-width:140px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
body.shot header,body.shot .bar,body.shot #caption{display:none}
body.shot.cap #caption{display:block;font-size:20px;bottom:18px}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

dline([-P.W/2,0,P.D/2+1.2],[P.W/2,0,P.D/2+1.2],`${P.W}"`,[0,-0.7,0.3]);
dline([P.W/2+1.2,0,P.D/2],[P.W/2+1.2,0,-P.D/2],`${P.D}"`,[1.2,-0.4,0]);
dline([-P.W/2-1.2,0,-P.D/2],[-P.W/2-1.2,P.H,-P.D/2],`${P.H}"`,[-1.4,0,0]);
cot.visible=q.get('cot')==='1';

// ---------------- animacion
const ease=x=>x<=0?0:x>=1?1:x*x*(3-2*x);const seg=(t,a,b)=>ease((t-a)/(b-a));
const STEPS=[[0,'<b>1.</b> P01 Cuerpo sobre la mesa, cara impresa abajo. Levantar el frente y doblar sus 2 solapas de esquina hacia atrás.'],
 [1.5,'<b>2.</b> Levantar el trasero/cabezal y doblar sus 2 solapas hacia adentro.'],
 [3,'<b>3.</b> Levantar los laterales por fuera de las 4 solapas.'],
 [3.8,'<b>4.</b> Doblar el forro de cada lateral 180° desde arriba hacia adentro (tipo mailer): atrapa las solapas y traba al piso con 2 lengüetas.'],
 [4.5,'<b>5.</b> P02 Escalones: doblar en zigzag.'],
 [5.5,'<b>6.</b> Bajar los escalones: las lengüetas entran solas en las ranuras de los forros (5 por lado).'],
 [6.5,'<b>7.</b> Bajar el forro del cabezal 180° por delante del trasero: sus 2 lengüetas traban en el pliegue del escalón 3.'],
 [7.3,'<b>8.</b> Cargar 4 frascos por escalón, de atrás hacia adelante.']];
let t=TEND,explode=q.get('explode')==='1',prod=q.get('prod')!=='0';
const P2F=new THREE.Vector3(0,P.LEVELS[0]-T,P.ZFL+P.S[1]),P2S=new THREE.Vector3(P.W/2+12,0,P.S[1]+4);
function setAng(B,name,f){const o=B.by[name];o.g.quaternion.setFromAxisAngle(o.ax,o.pn.ang*PI/180*f);}
function pose(){
  A.root.position.set(0,0,P.ZF);
  setAng(A,'front',seg(t,0,1));setAng(A,'flapR',seg(t,1,1.5));setAng(A,'flapL',seg(t,1,1.5));
  setAng(A,'back',seg(t,1.5,2.4));setAng(A,'flapBR',seg(t,2.4,3));setAng(A,'flapBL',seg(t,2.4,3));
  setAng(A,'sideR',seg(t,3,3.8));setAng(A,'sideL',seg(t,3,3.8));setAng(A,'linerR',seg(t,3.8,4.5));setAng(A,'linerL',seg(t,3.8,4.5));setAng(A,'head',seg(t,6.5,7.3));
  const fz=seg(t,4.5,5.5);for(const n of['leg0','r1','t2','r2','t3','leg3'])setAng(Bz,n,fz);
  const mv=seg(t,5.5,6.5);const above=new THREE.Vector3(P2F.x,P2F.y+9,P2F.z);
  let p;if(mv<0.6){p=P2S.clone().lerp(above,mv/0.6);}else{p=above.clone().lerp(P2F,(mv-0.6)/0.4);}
  if(t<4.5)p=P2S.clone();Bz.root.position.copy(p);
  if(explode&&t>=TEND-1e-6){Bz.root.position.y+=7;Bz.root.position.z+=0;A.by.head.g.quaternion.setFromAxisAngle(A.by.head.ax,PI*0.55);
    A.by.linerR.g.quaternion.setFromAxisAngle(A.by.linerR.ax,PI*0.8);A.by.linerL.g.quaternion.setFromAxisAngle(A.by.linerL.ax,PI*0.8);}
  for(const J of JARS){const a=7.3+J.k*0.55,f=seg(t,a,a+0.5);J.j.visible=prod&&f>0;J.j.position.set(J.x,J.y+(1-f)*6+(explode?17:0),J.z+(explode?5:0));}
  let cap=STEPS[0][1];for(const s of STEPS)if(t>=s[0]-1e-6)cap=s[1];
  document.getElementById('caption').innerHTML=t>=TEND-1e-6&&!q.get('cap')?`<b>Armado.</b> ${P.W} x ${P.D} x ${P.H} in · 12 frascos (3 escalones x 4) · corrugado flauta E 2 mm`:cap;}
const VIEWS={persp:[[-24,20,34],[0,5.5,0]],front:[[0,7,52],[0,6.5,0]],side:[[52,7,0],[0,6.5,0]],back:[[16,16,-44],[0,6.5,0]],top:[[0,55,6],[0,3,0]],
  tres:[[-30,44,66],[3,4,-3]],lejos:[[-40,36,52],[6,4,2]],det:[[-22,26,38],[1,6,-1]]};
function view(v){const[a,b]=VIEWS[v]||VIEWS.persp;cam.position.set(...a);ctl.target.set(...b);ctl.update();
  document.querySelectorAll('[data-v]').forEach(e=>e.classList.toggle('on',e.dataset.v===v));}
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();brandBg(w,h);}
window.addEventListener('resize',size);size();
const slider=document.getElementById('t');let playing=false,last=0;
document.getElementById('play').onclick=()=>{playing=!playing;if(playing&&t>=TEND-1e-6)t=0;last=performance.now();};
slider.oninput=()=>{t=+slider.value;playing=false;};
document.querySelectorAll('[data-v]').forEach(e=>e.onclick=()=>view(e.dataset.v));
const tg=(id,fn)=>{const e=document.getElementById(id);e.onclick=()=>{e.classList.toggle('on');fn(e.classList.contains('on'));};};
tg('exp',v=>explode=v);tg('prod',v=>prod=v);tg('cot',v=>cot.visible=v);
document.getElementById('exp').classList.toggle('on',explode);document.getElementById('cot').classList.toggle('on',cot.visible);
if(q.get('step'))t=+q.get('step');view(q.get('view')||'persp');
let frames=0;
(function loop(now){requestAnimationFrame(loop);if(playing){t=Math.min(TEND,t+(now-last)/1000*0.9);last=now;if(t>=TEND)playing=false;slider.value=t;}
  pose();ctl.update();renderer.render(scene,cam);if(pending===0&&++frames>3)window.__ready=true;})(0);
</script>
<script>(function(){if(new URLSearchParams(location.search).get('auto')==='0')return;addEventListener('load',function(){setTimeout(function(){var b=document.getElementById('play')||document.getElementById('bPlay')||document.getElementById('aPlay');if(b)b.click();},1200);});})();</script>
</body>
