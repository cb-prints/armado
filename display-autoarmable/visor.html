html,body{height:100%}

#app{display:flex;flex-direction:column;height:100%}
header{padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--panel)}

#stage{flex:1;position:relative;min-height:320px}
#stage canvas{display:block;width:100%;height:100%}

#legend{position:absolute;top:10px;right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);background:var(--panel);opacity:.92;border:1px solid var(--line);border-radius:6px;padding:6px 10px}
#legend i{display:inline-block;width:11px;height:11px;border-radius:2px;margin-right:6px;vertical-align:-1px;border:1px solid var(--line)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-top:1px solid var(--line);align-items:center}
button{font:inherit;padding:6px 10px;border-radius:5px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.rec{border-color:#c0392b;color:#c0392b}button.rec.on{background:#c0392b;border-color:#c0392b;color:#fff}
#recmsg{font-size:12px;color:var(--muted)}
button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
input[type=range]{flex:1;min-width:120px;accent-color:var(--accent)}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
body.shot header,body.shot .bar,body.shot #caption,body.shot #legend{display:none}
body.shot.cap #caption{display:block;font-size:20px;bottom:18px}
