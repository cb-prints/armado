<title>Armado Summer Farm v2</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap">
<style>
/* Layout: header, 3D stage, step caption, transport controls, step list */
:root{--bg:#F3F4F2;--fg:#1E2422;--muted:#616a67;--line:#D6DAD8;--accent:#14A39E;--chip:#FFFFFF;--stage:#e8eaea;--body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171A19;--fg:#EEF2F0;--muted:#9AA4A0;--line:#2E3432;--accent:#3CCBC5;--chip:#212624;--stage:#222826;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#171A19;--fg:#EEF2F0;--muted:#9AA4A0;--line:#2E3432;--accent:#3CCBC5;--chip:#212624;--stage:#222826;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:18px 28px;display:grid;gap:12px}
h1{font-size:clamp(20px,3.6vw,26px);font-weight:600;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:2px 0 0}
#stage{width:100%;max-width:100%;aspect-ratio:4/5;max-height:72vh;border-radius:14px;overflow:hidden;border:1px solid var(--line);touch-action:none;background:var(--stage)}
@media (min-width:760px){#stage{aspect-ratio:16/10}}
.cap{display:grid;gap:2px;min-height:64px}
.cap b{font-size:17px}
.cap span{color:var(--muted);font-size:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
button{font:500 14px var(--body);padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:var(--chip);color:var(--fg);cursor:pointer}
button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
button.rec{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sl{flex:1 1 200px;min-width:0;accent-color:var(--accent)}
#tm{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px;min-width:74px;text-align:right}
.steps{display:flex;flex-wrap:wrap;gap:6px}
.steps button{font-size:13px;padding:6px 10px}
#st{color:var(--muted);font-size:13px}
.steps button[aria-current="step"]{border-color:var(--accent);color:var(--accent)}
</style>

function shapeOf(p,flipX){const f=flipX?-1:1;const s=new THREE.Shape();p.outer.forEach(([x,y],i)=>i?s.lineTo(f*x,y):s.moveTo(f*x,y));
for(const h of p.holes){const q=new THREE.Path();h.forEach(([x,y],i)=>i?q.lineTo(f*x,y):q.moveTo(f*x,y));s.holes.push(q);}return s;}
function ext(sh){return new THREE.ExtrudeGeometry(sh,{depth:T,bevelEnabled:false,curveSegments:4});}
function mesh(g,m){const o=new THREE.Mesh(g,m);o.castShadow=true;o.receiveShadow=true;return o;}
function printed(sh,mat,u0,u1,v0,v1){const g=new THREE.ShapeGeometry(sh);const p=g.attributes.position,uv=[];for(let i=0;i<p.count;i++)uv.push((p.getX(i)-u0)/(u1-u0),(p.getY(i)-v0)/(v1-v0));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));const m=new THREE.Mesh(g,mat);m.receiveShadow=true;return m;}
function placed(geo,m4,mat){geo.applyMatrix4(m4);return mesh(geo,mat);}
function M4(e1,e2,e3,t){return new THREE.Matrix4().set(e1[0],e2[0],e3[0],t[0], e1[1],e2[1],e3[1],t[1], e1[2],e2[2],e3[2],t[2], 0,0,0,1);}

/* Construye el display armado. Devuelve grupos para animar. */
function buildDisplay(sc){const R={};
const mod=new THREE.Group();sc.add(mod);R.mod=mod;           /* modulo frontal: frente + laterales + bandejas + techo */
const lay=new THREE.Group();lay.position.set(0,0,ZO);mod.add(lay);R.lay=lay;
const inner=new THREE.Group();inner.position.set(0,0,-ZO);lay.add(inner);R.inner=inner;
const shF=shapeOf(PT.A_front);const fr=mesh(ext(shF),[mInner,mEdge]);fr.position.z=ZO-T;inner.add(fr);
const pf=printed(shF,mPrintF,-HW,HW,0,HT);pf.position.z=ZO+0.03;inner.add(pf);
R.ret={};
for(const [k,s] of [['R',1],['L',-1]]){const pv=new THREE.Group();pv.position.set(s*HW,0,ZO);inner.add(pv);
const sh=shapeOf(PT['A_ret'+k]);const m=mesh(ext(sh),[mInner,mEdge]);m.position.z=-T;pv.add(m);
const pp=printed(sh,mPrintR,s>0?0:-26,s>0?26:0,0,HT);pp.position.z=0.03;pv.add(pp);
pv.rotation.y=s*PI/2;R.ret[k]=pv;}
R.trays=[];
TRAY_Y.forEach(y0=>{const g=new THREE.Group();g.position.y=y0;inner.add(g);
g.add(placed(ext(shapeOf(PT.D_base)),M4([1,0,0],[0,0,1],[0,-1,0],[-IW/2,0,-ZI]),[mCream,mEdge]));
g.add(placed(ext(shapeOf(PT.D_lip)),M4([1,0,0],[0,1,0],[0,0,1],[-IW/2,-T,ZI-T]),[mCream,mEdge]));
R.trays.push(g);});
const roof=new THREE.Group();inner.add(roof);R.roof=roof;
roof.add(placed(ext(shapeOf(PT.E)),M4([1,0,0],[0,0,1],[0,-1,0],[-HW,113,-ZI]),[mGold,mEdge]));
/* silueta trasera */
const back=new THREE.Group();sc.add(back);R.back=back;
const shB=shapeOf(PT.B);const bm=mesh(ext(shB),[mInner,mEdge]);bm.position.z=-ZO;back.add(bm);
const pb=printed(shB,mPrintB,-HW,HW,0,HT);pb.rotation.y=PI;pb.position.z=-ZO-0.03;back.add(pb);
/* paneles inclinados */
R.caps={};const sA=Math.sin(ANG),cA=Math.cos(ANG);
{const g=new THREE.Group();sc.add(g);const e3=[-cA,sA,0];
g.add(placed(ext(shapeOf(PT.F1)),M4([0,0,1],[sA,cA,0],e3,[-X113-e3[0]*T/2,113-e3[1]*T/2,-ZI]),[mGold,mEdge]));R.caps.L={g,u:[sA,cA]};}
{const g=new THREE.Group();sc.add(g);const e3=[cA,sA,0];
g.add(placed(ext(shapeOf(PT.F2)),M4([0,0,-1],[-sA,cA,0],e3,[X113-e3[0]*T/2,113-e3[1]*T/2,-ZI+FW]),[mGold,mEdge]));R.caps.R={g,u:[-sA,cA]};}
/* tapa superior */
const top=new THREE.Group();sc.add(top);R.top=top;
top.add(placed(ext(shapeOf(PT.G)),M4([1,0,0],[0,0,1],[0,-1,0],[-PR.G_W/2,160,-ZI]),[mWhite,mEdge]));
/* producto */
R.bottles=[];{const bg=new THREE.CylinderGeometry(3.6,3.6,15.8,20);bg.scale(1,1,0.5);const am=new THREE.MeshPhysicalMaterial({color:0xD9730A,roughness:0.15,clearcoat:1,clearcoatRoughness:0.1});
const bImg=new Image();const bT=new THREE.Texture(bImg);bT.encoding=THREE.sRGBEncoding;bImg.onload=()=>{bT.needsUpdate=true;};bImg.src=BOTTLE_URI;
const fm=new THREE.MeshStandardMaterial({map:bT,transparent:true,alphaTest:0.5,roughness:0.3});const fg=new THREE.PlaneGeometry(7.6,17.55);const cg=new THREE.BoxGeometry(6.2,2,3.2);
TRAY_Y.forEach((y0,i)=>{for(let j=0;j<4;j++)for(let k=0;k<5;k++){const b=new THREE.Group();const m=new THREE.Mesh(bg,am);m.position.y=7.9;m.castShadow=true;b.add(m);const c=new THREE.Mesh(cg,mGold);c.position.y=16.6;b.add(c);const fp=new THREE.Mesh(fg,fm);fp.position.set(0,8.78,1.92);b.add(fp);
b.position.set(-18.4+k*9.2,y0,7.0-j*4.6);b.userData={i,y0};sc.add(b);R.bottles.push(b);}});}
return R;}

const STEPS=[

{t:4,n:'Bandejas',d:'Abrir apenas los laterales y colocar las 4 bandejas, con la pestaña doblada contra el frente. Sus lengüetas entran en las ranuras de los laterales.'},
{t:10,n:'Techo',d:'Apoyar el techo sobre los cantos superiores de los laterales, con sus 2 lengüetas hacia atrás.'},
{t:12.5,n:'Parar el módulo',d:'Levantar el módulo frontal y pararlo, 0.8 in (2 cm) por encima del piso.'},
{t:15.5,n:'Silueta trasera',d:'Parar la silueta trasera detrás. Empujar el módulo hacia atrás: los 8 ganchos de los laterales entran en las muescas de los cantos y las lengüetas del techo en sus ranuras.'},
{t:20,n:'Bajar y trabar',d:'Bajar el módulo 0.8 in hasta el piso: los 8 ganchos quedan trabados detrás de la silueta trasera. Desde el frente no se ve ninguno.'},

{t:29,n:'Tapa superior',d:'Bajarla en las muescas de las dos siluetas. Su lengüeta delantera queda al ras del frente.'},

const TEND=38;
const clamp=x=>Math.max(0,Math.min(1,x));
const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
const sg=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const pulse=(t,a,b)=>{if(t<a||t>b)return 0;const k=(t-a)/(b-a);return Math.min(1,Math.min(k,1-k)*5)*(0.65+0.35*Math.sin(t*9));};
const LIFT=HKD,ZOFF=40;
function upd(t){
/* modulo frontal: acostado boca abajo (giro 90° sobre el canto inferior del frente), se para, va atras y baja */
const stand=sg(t,12.6,15);
D3.lay.rotation.x=(1-stand)*PI/2;
const lift=LIFT*(1-sg(t,20.2,21.6));
const zo=ZOFF*(1-sg(t,17,19.6));
D3.mod.position.set(0,lift+(1-stand)*0.01,zo);
/* pliegue de laterales; se abren 8° al entrar las bandejas */
const fold=sg(t,0.8,3.4)-0.09*(sg(t,4,4.8)-sg(t,8.6,9.4));
D3.ret.R.rotation.y=fold*PI/2;D3.ret.L.rotation.y=-fold*PI/2;
hlv('fold',pulse(t,0.6,3.8));
/* bandejas entran desde atras del modulo (desde arriba mientras esta acostado) */
D3.trays.forEach((g,i)=>{const a=4.6+1.0*i;g.visible=t>=a-0.05;g.position.z=-(1-sg(t,a,a+1.2))*60;});
D3.roof.visible=t>=10;D3.roof.position.z=-(1-sg(t,10.1,11.6))*45;
/* silueta trasera */
D3.back.visible=t>=15.4;D3.back.position.set(0,0,-(1-sg(t,15.5,16.8))*30);
hlv('hooks',pulse(t,19.4,22.4));
/* paneles inclinados: bajan por arriba, entran 2.27 cm al dorso y deslizan 2 cm */
for(const k of ['L','R']){const c=D3.caps[k];c.g.visible=t>=22.6;
const along=HKD+(1-sg(t,22.8,25.4))*60-HKD*sg(t,26.6,27.6);const back=TDp*(1-sg(t,25.6,26.4));
c.g.position.set(c.u[0]*along,c.u[1]*along,back);}
hlv('caps',pulse(t,25.4,28.6));
D3.top.visible=t>=29;D3.top.position.y=(1-sg(t,29.2,30.8))*30;hlv('top',pulse(t,30.4,31.8));
D3.bottles.forEach((b,n)=>{const a=31.6+b.userData.i*0.7+(n%20)*0.02;const k=sg(t,a,a+0.8);b.visible=k>0.001;b.position.y=b.userData.y0+(1-k)*14;});
}
const CK=[[0,[130,210,320],[0,5,130]],[3.8,[130,210,320],[0,5,130]],[4.4,[150,230,300],[0,10,125]],[11.8,[150,230,300],[0,10,125]],[13.6,[230,170,300],[0,75,40]],[16,[-230,160,-200],[0,75,10]],
[19.2,[-230,160,-200],[0,75,10]],[20,[-110,80,-125],[15,45,-10]],[22.2,[-110,80,-125],[15,45,-10]],[23.4,[170,250,200],[0,120,0]],[25.2,[170,250,200],[0,120,0]],[26,[-150,220,-150],[0,125,-10]],
[28.6,[-150,220,-150],[0,125,-10]],[29.6,[120,240,220],[0,130,0]],[31.6,[165,135,300],[0,80,0]],[38,[165,135,300],[0,80,0]]];

cam.position.copy(v3(p0).lerp(v3(p1),k));ctl.target.copy(v3(q0).lerp(v3(q1),k));}

cx2.fillStyle='#ffffff';cx2.fillRect(0,0,W,H);cx2.fillStyle='#1E2422';cx2.font='600 '+Math.round(hh*0.42)+'px system-ui,sans-serif';cx2.textBaseline='middle';

function errMsg(e){const c=e&&e.code;if(c==='declined')return 'Guardado cancelado';if(c==='rate_limited')return 'Espera un momento y prueba de nuevo';return 'No se pudo guardar el video';}
(async()=>{const dlc=window.claude&&await window.claude.use('downloads');if(!dlc)return;
const types=['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm'];const mime=window.MediaRecorder&&types.find(x=>MediaRecorder.isTypeSupported(x));
