<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mesa booth 3D</title>
<style>
:root{--bg:#eef0f2;--panel:#ffffff;--ink:#1d2329;--muted:#5d6670;--line:#d5d9de;--accent:#c8102e;--accent2:#0b7a3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#ff5a6e;--accent2:#3fcf7f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#ff5a6e;--accent2:#3fcf7f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .dim{color:var(--muted)}
#stage{flex:1;position:relative;min-height:320px}
#stage canvas{display:block;width:100%;height:100%}
#caption{position:absolute;left:16px;right:16px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
#caption b{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
input[type=range]{flex:1;min-width:140px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
body.shot header,body.shot .bar,body.shot #caption{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="app">
<header><h1>Mesa booth desarmable</h1><span class="dim" id="dims"></span></header>
<div id="stage"><div id="caption"></div></div>
<div class="bar">
  <button data-v="persp" class="on">3/4</button><button data-v="front">Frente</button><button data-v="side">Lateral</button><button data-v="back">Atrás</button><button data-v="top">Arriba</button><button data-v="under">Abajo</button>
  <span class="sep"></span>
  <button id="play">Armar ▶</button><input id="t" type="range" min="0" max="6" step="0.01" value="6">
  <button id="exp">Explosionada</button><button id="cot" class="on">Cotas</button>
</div>
</div>
<script>
const DATA={"P": {"SHW": 83.0, "SHH": 48.0, "MRG": 0.4, "GAP": 0.4, "T": 0.3937, "SW": 0.45, "H": 40.0, "W": 80.0, "D": 20.0, "EO": 4.0, "DL": 18.0, "HL": 39.6063, "HSB": 7.606, "VE": 1.5, "TW": 3.0, "TP": 0.3937, "LEG_TABS": [-5.0, 5.0], "SP_TABS": [-28.0, -14.0, 0.0, 14.0, 28.0], "ARCH": [6.0, 1.0, 0.5], "RC": 0.75, "XL": 35.8032, "LS": 75.0, "HALF": 3.803, "SP_Z0": 32.0003}, "top": [[[39.25, -10.0], [39.3963, -9.9856], [39.537, -9.9429], [39.6667, -9.8736], [39.7803, -9.7803], [39.8736, -9.6667], [39.9429, -9.537], [39.9856, -9.3963], [40.0, -9.25], [40.0, 9.25], [39.9856, 9.3963], [39.9429, 9.537], [39.8736, 9.6667], [39.7803, 9.7803], [39.6667, 9.8736], [39.537, 9.9429], [39.3963, 9.9856], [39.25, 10.0], [-39.25, 10.0], [-39.3963, 9.9856], [-39.537, 9.9429], [-39.6667, 9.8736], [-39.7803, 9.7803], [-39.8736, 9.6667], [-39.9429, 9.537], [-39.9856, 9.3963], [-40.0, 9.25], [-40.0, -9.25], [-39.9856, -9.3963], [-39.9429, -9.537], [-39.8736, -9.6667], [-39.7803, -9.7803], [-39.6667, -9.8736], [-39.537, -9.9429], [-39.3963, -9.9856], [-39.25, -10.0]], [[-36.0282, -6.53], [-35.5782, -6.53], [-35.5782, -3.47], [-36.0282, -3.47]], [[-36.0282, 3.47], [-35.5782, 3.47], [-35.5782, 6.53], [-36.0282, 6.53]], [[35.5782, -6.53], [36.0282, -6.53], [36.0282, -3.47], [35.5782, -3.47]], [[35.5782, 3.47], [36.0282, 3.47], [36.0282, 6.53], [35.5782, 6.53]], [[-29.53, -0.225], [-26.47, -0.225], [-26.47, 0.225], [-29.53, 0.225]], [[-15.53, -0.225], [-12.47, -0.225], [-12.47, 0.225], [-15.53, 0.225]], [[-1.53, -0.225], [1.53, -0.225], [1.53, 0.225], [-1.53, 0.225]], [[12.47, -0.225], [15.53, -0.225], [15.53, 0.225], [12.47, 0.225]], [[26.47, -0.225], [29.53, -0.225], [29.53, 0.225], [26.47, 0.225]]], "leg": [[[-9.0, 0], [-6.0, 0], [-6.0, 0.5], [-5.9904, 0.5975], [-5.9619, 0.6913], [-5.9157, 0.7778], [-5.8536, 0.8536], [-5.7778, 0.9157], [-5.6913, 0.9619], [-5.5975, 0.9904], [-5.5, 1.0], [5.5, 1.0], [5.5975, 0.9904], [5.6913, 0.9619], [5.7778, 0.9157], [5.8536, 0.8536], [5.9157, 0.7778], [5.9619, 0.6913], [5.9904, 0.5975], [6.0, 0.5], [6.0, 0], [9.0, 0], [9.0, 39.6063], [6.5, 39.6063], [6.5, 40.0], [3.5, 40.0], [3.5, 39.6063], [0.225, 39.6063], [0.225, 35.8033], [-0.225, 35.8033], [-0.225, 39.6063], [-3.5, 39.6063], [-3.5, 40.0], [-6.5, 40.0], [-6.5, 39.6063], [-9.0, 39.6063]]], "spine": [[[-37.5, 0], [-36.0282, 0], [-36.0282, 3.803], [-35.5782, 3.803], [-35.5782, 0], [35.5782, 0], [35.5782, 3.803], [36.0282, 3.803], [36.0282, 0], [37.5, 0], [37.5, 7.606], [29.5, 7.606], [29.5, 7.9997], [26.5, 7.9997], [26.5, 7.606], [15.5, 7.606], [15.5, 7.9997], [12.5, 7.9997], [12.5, 7.606], [1.5, 7.606], [1.5, 7.9997], [-1.5, 7.9997], [-1.5, 7.606], [-12.5, 7.606], [-12.5, 7.9997], [-15.5, 7.9997], [-15.5, 7.606], [-26.5, 7.606], [-26.5, 7.9997], [-29.5, 7.9997], [-29.5, 7.606], [-37.5, 7.606]]]};
const P=DATA.P,T=P.T,H=P.H,W=P.W,D=P.D,HL=P.HL,XL=P.XL,Z0=P.SP_Z0;
const q=new URLSearchParams(location.search); if(q.get('shot'))document.body.classList.add('shot');
document.getElementById('dims').textContent=`${W} x ${D} x ${H} in (ancho x fondo x alto) · honeycomb 10 mm · 4 piezas · 1 hoja 83 x 48 in · sin pegamento`;
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;stage.prepend(renderer.domElement);
const scene=new THREE.Scene();
const dark=matchMedia('(prefers-color-scheme: dark)').matches&&!q.get('shot');
scene.background=new THREE.Color(dark?0x1b1f23:0xeef0f2);
const cam=new THREE.PerspectiveCamera(32,1,1,1200);
const ctl=new THREE.OrbitControls(cam,renderer.domElement);ctl.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x8a8f96,0.75));
const sun=new THREE.DirectionalLight(0xffffff,0.75);sun.position.set(60,110,80);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-70,right:70,top:70,bottom:-70,near:1,far:320});scene.add(sun);
const fill=new THREE.DirectionalLight(0xffffff,0.3);fill.position.set(-70,40,-60);scene.add(fill);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(600,600),new THREE.ShadowMaterial({opacity:0.18}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const grid=new THREE.GridHelper(192,16,dark?0x3a4046:0xc9ced4,dark?0x2a2f34:0xdde1e5);grid.position.y=0.001;scene.add(grid);
const FACE=new THREE.MeshStandardMaterial({color:0xf7f7f4,roughness:0.65});
const CORE=new THREE.MeshStandardMaterial({color:0xc9a66b,roughness:0.9});
const EDGE=new THREE.LineBasicMaterial({color:0x8f969d});
function shape(r){const s=new THREE.Shape(r[0].map(p=>new THREE.Vector2(p[0],p[1])));for(const h of r.slice(1))s.holes.push(new THREE.Path(h.map(p=>new THREE.Vector2(p[0],p[1]))));return s;}
function edges(r,z0,z1){const v=[];for(const ring of r)for(let i=0;i<ring.length;i++){const a=ring[i],b=ring[(i+1)%ring.length];for(const z of[z0,z1])v.push(a[0],a[1],z,b[0],b[1],z);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(v,3));return new THREE.LineSegments(g,EDGE);}
// placa extruida de z0 a z0+T, caras blancas y canto de honeycomb
function slab(r,z0){const g=new THREE.Group();const geo=new THREE.ExtrudeGeometry(shape(r),{depth:T,bevelEnabled:false,curveSegments:8});geo.translate(0,0,z0);
  const m=new THREE.Mesh(geo,[FACE,CORE]);m.castShadow=true;m.receiveShadow=true;g.add(m);g.add(edges(r,z0+T+0.004,z0-0.004));return g;}
const piv=new THREE.Group(),tbl=new THREE.Group();piv.add(tbl);scene.add(piv);
// cubierta: forma (x, fondo) -> mundo (x, -z), extrusion -> alto
const top_=new THREE.Group(),tm=slab(DATA.top,0);tm.rotation.x=-Math.PI/2;top_.add(tm);top_.userData.f=HL;tbl.add(top_);
// patas: forma (u, v) -> mundo (z=-u, y=v), extrusion centrada en x
const legs=[-1,1].map(s=>{const g=new THREE.Group(),m=slab(DATA.leg,-T/2);m.rotation.y=Math.PI/2;g.add(m);g.userData.x=s*XL;tbl.add(g);return g;});
// viga: forma (x, v) -> mundo (x, Z0+v), centrada en z
const spine=new THREE.Group();spine.add(slab(DATA.spine,-T/2));tbl.add(spine);
// cotas
const cot=new THREE.Group();scene.add(cot);
function label(txt,pos){const c=document.createElement('canvas');c.width=256;c.height=96;const x=c.getContext('2d');x.fillStyle='rgba(255,255,255,0.92)';x.fillRect(0,0,256,96);
  x.fillStyle='#c8102e';x.font='bold 54px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(txt,128,50);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(12,4.5,1);s.position.copy(pos);s.renderOrder=9;cot.add(s);}
function dim(a,b,txt,off){const m=new THREE.LineBasicMaterial({color:0xc8102e,depthTest:false});const g=new THREE.BufferGeometry().setFromPoints([a,b]);const l=new THREE.Line(g,m);l.renderOrder=8;cot.add(l);
  for(const p of[a,b]){const tk=new THREE.BufferGeometry().setFromPoints([p.clone().sub(off),p.clone().add(off)]);const t=new THREE.Line(tk,m);t.renderOrder=8;cot.add(t);}
  label(txt,a.clone().add(b).multiplyScalar(0.5));}
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
dim(V(-W/2,H+4,D/2),V(W/2,H+4,D/2),`${W} in`,V(0,1.5,0));
dim(V(W/2+5,H+1,-D/2),V(W/2+5,H+1,D/2),`${D} in`,V(1.5,0,0));
dim(V(-W/2-5,0,D/2),V(-W/2-5,H,D/2),`${H} in`,V(1.5,0,0));
let COT=q.get('cot')!=='0';
const STEPS=["<b>1.</b> Cubierta (T01) boca abajo sobre el piso limpio, cara impresa hacia abajo.",
 "<b>2.</b> Viga central (P03) con las muescas hacia arriba: sus 5 lengüetas entran en las ranuras del centro de la cubierta.",
 "<b>3.</b> Primera pata (P02), muesca hacia abajo: baja sobre la muesca de la viga y sus 2 lengüetas entran en la cubierta.",
 "<b>4.</b> Segunda pata (P02), igual en el otro extremo.",
 "<b>5.</b> Dar vuelta la mesa (mejor entre 2 personas) y apoyarla sobre las patas.",
 `<b>Armada</b> · ${W} x ${D} x ${H} in · 4 piezas, sin pegamento. Las lengüetas quedan al ras de la cubierta.`];
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x);
let EXP=q.get('explode')==='1';
function setT(t){const ph=k=>ease(Math.min(1,Math.max(0,(t-k)/0.8)));
  // en el tramo invertido, "arriba" del mundo = -y local
  const fl=ph(4);piv.rotation.x=Math.PI*(1-fl);piv.position.y=H/2+14*Math.sin(Math.PI*fl);tbl.position.y=-H/2;
  top_.position.set(0,HL-28*(1-ph(0)),0);
  spine.visible=t>1;spine.position.set(0,Z0-24*(1-ph(1)),0);
  legs.forEach((g,i)=>{g.visible=t>2+i;g.position.set(g.userData.x,-50*(1-ph(2+i)),0);});
  if(EXP&&t>=6){top_.position.y=HL+22;spine.position.y=Z0+8;legs.forEach(g=>g.position.x=g.userData.x*1.35);}
  cot.visible=COT&&t>=6&&!EXP;
  document.getElementById('caption').innerHTML=EXP&&t>=6?"<b>Vista explosionada</b> · T01 Cubierta x1, P03 Viga central x1, P02 Pata x2":STEPS[Math.min(5,Math.floor(t+1e-6))];}
const VIEWS={persp:[105,72,125],front:[0,24,175],side:[160,24,0],back:[0,24,-175],top:[0,190,0.01],under:[70,-40,90],paso:[95,95,120]};
function view(v){const p=VIEWS[v]||VIEWS.persp;const s=EXP?1.3:1;cam.position.set(p[0]*s,p[1]*s,p[2]*s);ctl.target.set(0,v==='top'?0:EXP?26:H*0.5,0);ctl.update();
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
const tEl=document.getElementById('t');let playing=false,last=0;
tEl.oninput=()=>{playing=false;setT(+tEl.value);};
document.getElementById('play').onclick=()=>{playing=!playing;if(playing&&+tEl.value>=6)tEl.value=0;document.getElementById('play').textContent=playing?'Pausa ❚❚':'Armar ▶';};
document.getElementById('exp').onclick=e=>{EXP=!EXP;e.target.classList.toggle('on',EXP);tEl.value=6;setT(6);view('persp');};
document.getElementById('cot').onclick=e=>{COT=!COT;e.target.classList.toggle('on',COT);setT(+tEl.value);};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const t0=q.get('step')!=null?+q.get('step'):6;tEl.value=t0;setT(t0);view(q.get('view')||'persp');
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(playing){let t=+tEl.value+dt*0.5;if(t>=6){t=6;playing=false;document.getElementById('play').textContent='Armar ▶';}tEl.value=t;setT(t);}
  ctl.update();renderer.render(scene,cam);window.__ready=true;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
<script>(function(){if(new URLSearchParams(location.search).get('auto')==='0')return;addEventListener('load',function(){setTimeout(function(){var b=document.getElementById('play')||document.getElementById('bPlay')||document.getElementById('aPlay');if(b)b.click();},1200);});})();</script>
</body>
</html>
