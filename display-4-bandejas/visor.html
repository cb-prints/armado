<style>
:root{--bg:#eef0f2;--panel:#ffffff;--ink:#1d2329;--muted:#5d6670;--line:#d5d9de;--accent:#1f3a5f;--accent2:#0e8f8a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#8fb8ff;--accent2:#2fc4bd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#8fb8ff;--accent2:#2fc4bd;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .dim{color:var(--muted)}
#stage{flex:1;position:relative;min-height:320px}
#stage canvas{display:block;width:100%;height:100%}
#caption{position:absolute;left:16px;right:16px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
#caption b{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
input[type=range]{flex:1;min-width:140px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
#rec.on{background:#c62828;border-color:#c62828;color:#fff}
#msg{color:var(--muted);font-size:12px}
body.shot header,body.shot .bar,body.shot #caption{display:none}
body.shot.cap #caption{display:block;font-size:20px;bottom:18px}
</style>

const tEl=document.getElementById('t');let playing=false,last=0;
tEl.oninput=()=>{playing=false;setT(+tEl.value);};
document.getElementById('play').onclick=()=>{playing=!playing;if(playing&&+tEl.value>=TEND)tEl.value=0;document.getElementById('play').textContent=playing?'Pausa ❚❚':'Armar ▶';};
document.getElementById('exp').onclick=e=>{EXP=!EXP;e.target.classList.toggle('on',EXP);tEl.value=TEND;setT(TEND);view('persp');};
document.getElementById('cot').onclick=e=>{SHOWCOT=!SHOWCOT;e.target.classList.toggle('on',SHOWCOT);setT(+tEl.value);};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const msg=t=>{document.getElementById('msg').textContent=t;};
let DL=null;const dlP=(window.claude&&window.claude.use)?window.claude.use('downloads').then(d=>DL=d).catch(()=>null):Promise.resolve(null);
const stamp=()=>new Date().toISOString().slice(0,16).replace(/[-:T]/g,'');
async function offer(blob,name){
  await dlP;
  if(DL){try{await DL.save({filename:name,data:blob});msg('Guardado: '+name);}
    catch(e){msg(e&&e.code==='declined'?'Descarga cancelada':'No se pudo guardar ('+(e&&e.code||'error')+')');}return;}
  if(window.claude){msg('Esta vista no permite descargar archivos');return;}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),4000);msg('Guardado: '+name);}
document.getElementById('snap').onclick=()=>{renderer.render(scene,cam);
  renderer.domElement.toBlob(b=>b?offer(b,`Display_4_bandejas_${stamp()}.png`):msg('No se pudo capturar'),'image/png');};
let REC=null,ONREC=false;
function stopRec(){if(REC&&REC.state!=='inactive')REC.stop();}
document.getElementById('rec').onclick=()=>{
  if(REC&&REC.state==='recording'){stopRec();return;}
  if(!window.MediaRecorder||!renderer.domElement.captureStream){msg('Este navegador no puede grabar video');return;}
  const types=['video/mp4;codecs=avc1','video/mp4;codecs=avc1.42E01E','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';const ext=mime.startsWith('video/mp4')?'mp4':'webm';
  const chunks=[];REC=new MediaRecorder(renderer.domElement.captureStream(30),mime?{mimeType:mime,videoBitsPerSecond:8e6}:{});
  REC.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
  REC.onstop=()=>{const b=document.getElementById('rec');b.classList.remove('on');b.textContent='● Grabar video';ONREC=false;
    offer(new Blob(chunks,{type:mime||'video/webm'}),`Display_4_bandejas_armado_${stamp()}.${ext}`);};
  EXP=false;document.getElementById('exp').classList.remove('on');
  tEl.value=0;setT(0);REC.start(250);ONREC=true;playing=true;
  const b=document.getElementById('rec');b.classList.add('on');b.textContent='■ Detener';document.getElementById('play').textContent='Pausa ❚❚';msg('Grabando el armado…');};

const t0=q.get('step')!=null?+q.get('step'):TEND;tEl.value=t0;setT(t0);view(q.get('view')||'persp');
let frames=0;
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(playing){let t=+tEl.value+dt*0.5;if(t>=TEND){t=TEND;playing=false;document.getElementById('play').textContent='Armar ▶';if(ONREC)setTimeout(stopRec,1500);}tEl.value=t;setT(t);}
  ctl.update();renderer.render(scene,cam);if(++frames>3)window.__ready=true;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
<script>(function(){if(new URLSearchParams(location.search).get('auto')==='0')return;addEventListener('load',function(){setTimeout(function(){var b=document.getElementById('play')||document.getElementById('bPlay')||document.getElementById('aPlay');if(b)b.click();},1200);});})();</script>
</body>
</html>
