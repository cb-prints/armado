button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
input[type=range]{flex:1;min-width:140px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
body.shot header,body.shot .bar,body.shot #caption{display:none}
</style>

function dim(a,b,txt,off){const m=new THREE.LineBasicMaterial({color:0xc8102e,depthTest:false});const l=new THREE.Line(new THREE.BufferGeometry().setFromPoints([a,b]),m);l.renderOrder=8;cot.add(l);
  for(const p of[a,b]){const t=new THREE.Line(new THREE.BufferGeometry().setFromPoints([p.clone().sub(off),p.clone().add(off)]),m);t.renderOrder=8;cot.add(t);}
  label(txt,a.clone().add(b).multiplyScalar(0.5));}
const V=(x,y,z)=>new THREE.Vector3(x,y,z),W2=P.TOPW/2,D2=P.TOPD/2;
dim(V(-W2,H+3,D2),V(W2,H+3,D2),`${P.TOPW} in`,V(0,1,0));
dim(V(-W2-3,0,-D2),V(-W2-3,0,D2),`${P.TOPD} in`,V(1,0,0));
dim(V(-W2-3,0,D2),V(-W2-3,H,D2),`${H} in`,V(1,0,0));
let COT=q.get('cot')!=='0',EXP=q.get('explode')==='1';
const TMAX=5;
const STEPS=["<b>1.</b> Frente (P03) parado en el piso, ranuras hacia arriba, y travesaño bajo (P07) parado atrás, ranuras hacia arriba. Sostenerlos con la mano.",
 `<b>2.</b> Laterales (2 x P02, iguales): bajan desde arriba: ranura con ranura, a media madera con el frente hasta ${P.Y1} in y con el travesaño bajo en el pie de atrás.`,
 `<b>3.</b> Aletas (2 x P04, iguales): bajan desde arriba en diagonal a ${P.TH}°; ranura con ranura, a media madera con el lateral hasta ${P.Y2} in.`,
 `<b>4.</b> Estante (P05): entra desde atrás a ${P.YS} in, a media madera, y asoma como repisa. Travesaño (P06): baja atrás, a media madera con los 2 laterales.`,
 "<b>5.</b> Cubierta (T01): baja y las lengüetas de laterales, frente y aletas entran en sus ranuras.",
 `<b>Armado</b> · ${P.TOPW} x ${P.TOPD} x ${H} in · simétrico · todo encastra de arriba hacia abajo · sin pegamento.`];
const ease=x=>x<0?0:x>1?1:x*x*(3-2*x),cl=x=>Math.min(1,Math.max(0,x));
function setT(t){
  const pos=(g,dx,dy,dz)=>g.position.set(dx,dy,dz);
  FR.visible=t>0;pos(FR,0,20*(1-ease(cl(t/0.8))),0);
  [sideL,sideR].forEach((g,i)=>{g.visible=t>1+i*0.3;pos(g,0,30*(1-ease(cl((t-1-i*0.3)/0.6))),0);});
  [finL,finR].forEach((g,i)=>{g.visible=t>2+i*0.3;pos(g,0,30*(1-ease(cl((t-2-i*0.3)/0.6))),0);});
  shelves.forEach((g,i)=>{g.visible=t>3+i*0.3;pos(g,0,0,-22*(1-ease(cl((t-3-i*0.3)/0.6))));});
  bar2.visible=t>0.3;pos(bar2,0,0,-14*(1-ease(cl((t-0.3)/0.6))));
  bar.visible=t>3.55;pos(bar,0,14*(1-ease(cl((t-3.55)/0.4))),0);
  top_.visible=t>4;pos(top_,0,14*(1-ease(cl((t-4)/0.8))),0);
  if(EXP&&t>=TMAX){top_.position.y+=16;sideL.position.x-=10;sideR.position.x+=10;FR.position.z+=8;finL.position.set(-8,4,14);finR.position.set(8,4,14);shelves.forEach((g,i)=>g.position.z-=14+4*i);bar.position.y+=8;bar.position.z-=12;bar2.position.z-=12;}
  cot.visible=COT&&t>=TMAX&&!EXP;
  document.getElementById('caption').innerHTML=EXP&&t>=TMAX?"<b>Vista explosionada</b> · T01 cubierta, 2 x P02 lateral, P03 frente, 2 x P04 aleta, P05 estante, P06 travesaño, P07 travesaño bajo":STEPS[Math.min(TMAX,Math.floor(t+1e-6))];}
const VIEWS={persp:[[-44,50,108],[0,H*0.47,0]],back3:[[-88,50,-72],[0,H*0.47,0]],front:[[0,22,118],[0,H*0.47,0]],left:[[-118,22,0],[0,H*0.47,0]],right:[[118,22,0],[0,H*0.47,0]],
  top:[[0,135,0.01],[0,0,0]],paso:[[-60,62,80],[0,14,0]],mm:[[-46,26,50],[-P.XS,P.Y2+2,P.ZFC-1]]};
function view(v){const p=VIEWS[v]||VIEWS.persp;const s=EXP?1.35:1;cam.position.set(p[0][0]*s,p[0][1]*s,p[0][2]*s);
  ctl.target.set(...p[1]);ctl.update();
  document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));}
function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
const tEl=document.getElementById('t');let playing=false,last=0;
tEl.oninput=()=>{playing=false;setT(+tEl.value);};
document.getElementById('play').onclick=()=>{playing=!playing;if(playing&&+tEl.value>=TMAX)tEl.value=0;document.getElementById('play').textContent=playing?'Pausa ❚❚':'Armar ▶';};
document.getElementById('exp').onclick=e=>{EXP=!EXP;e.target.classList.toggle('on',EXP);tEl.value=TMAX;setT(TMAX);view('persp');};
document.getElementById('cot').onclick=e=>{COT=!COT;e.target.classList.toggle('on',COT);setT(+tEl.value);};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const t0=q.get('step')!=null?+q.get('step'):TMAX;tEl.value=t0;setT(t0);view(q.get('view')||'persp');
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(playing){let t=+tEl.value+dt*0.35;if(t>=TMAX){t=TMAX;playing=false;document.getElementById('play').textContent='Armar ▶';}tEl.value=t;setT(t);}
  ctl.update();renderer.render(scene,cam);window.__ready=texOK;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
<script>(function(){if(new URLSearchParams(location.search).get('auto')==='0')return;addEventListener('load',function(){setTimeout(function(){var b=document.getElementById('play')||document.getElementById('bPlay')||document.getElementById('aPlay');if(b)b.click();},1200);});})();</script>
