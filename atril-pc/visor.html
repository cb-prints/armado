<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atril PC 3D</title>
<style>
:root{--bg:#eef0f2;--panel:#ffffff;--ink:#1d2329;--muted:#5d6670;--line:#d5d9de;--accent:#c8102e;--accent2:#0b7a3b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#ff5a6e;--accent2:#3fcf7f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#15181b;--panel:#1f2327;--ink:#eef0f2;--muted:#a3abb4;--line:#343a40;--accent:#ff5a6e;--accent2:#3fcf7f;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{display:flex;flex-direction:column;height:100%}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;border-bottom:1px solid var(--line);background:var(--panel)}
header h1{font-size:16px;margin:0}
header .dim{color:var(--muted)}
#stage{flex:1;position:relative;min-height:320px}
#stage canvas{display:block;width:100%;height:100%}
#caption{position:absolute;left:16px;right:16px;bottom:12px;background:color-mix(in srgb,var(--panel) 88%,transparent);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:13px}
#caption b{color:var(--accent)}
.bar{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px;background:var(--panel);border-top:1px solid var(--line);align-items:center}
button{font:inherit;padding:6px 10px;border-radius:6px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
button.on{background:var(--accent2);border-color:var(--accent2);color:#fff}
input[type=range]{flex:1;min-width:140px}
.sep{width:1px;height:22px;background:var(--line);margin:0 4px}
body.shot header,body.shot .bar,body.shot #caption{display:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
<div id="app">
<header><h1>Atril de pie para computadora</h1><span class="dim" id="dims"></span></header>
<div id="stage"><div id="caption"></div></div>
<div class="bar">
  <button data-v="persp" class="on">3/4</button><button data-v="front">Frente</button><button data-v="side">Lateral</button><button data-v="back">Atrás</button><button data-v="top">Arriba</button>
  <span class="sep"></span>
  <button id="play">Armar ▶</button><input id="t" type="range" min="0" max="8" step="0.01" value="8">
  <button id="exp">Explosionada</button><button id="cot" class="on">Cotas</button><button id="eq" class="on">Equipo</button>
</div>
</div>

const ease=x=>x<0?0:x>1?1:x*x*(3-2*x),cl=(x)=>Math.min(1,Math.max(0,x));

function setT(t){
  // 0..6 acostado sobre el trasero; 6..7 se para; 7..8 cubierta
  const up=ease(cl(t-6));const L=-(ZB-T/2);
  piv.rotation.x=-Math.PI/2*(1-up);piv.position.y=L*(1-up)+8*Math.sin(Math.PI*up);
  const pos=(g,dx,dy,dz)=>{const f=g.userData.f;g.position.set(f[0]+dx,f[1]+dy,f[2]+dz);};
  pos(back,0,0,0);
  div.visible=t>1;pos(div,0,0,26*(1-ease(cl((t-1)/0.8))));
  shelves.forEach((g,i)=>{g.visible=t>2;const p=ease(cl((t-2-i*0.12)/0.6));pos(g,0,0,26*(1-p));});
  sides.forEach((g,i)=>{const k=3+2*i+(i?-1:0);// izq: 3..5, der: 5..6
    let ap,sl;if(i===0){ap=ease(cl((t-3)/0.8));sl=ease(cl((t-4)/0.8));}else{ap=ease(cl((t-5)/0.45));sl=ease(cl((t-5.5)/0.45));}

  document.getElementById('caption').innerHTML=EXP&&t>=8?"<b>Vista explosionada</b> · T01 x1, P02 x1, P03 x1, P04 x1, P05 x1, P06 x2, P07 x2":STEPS[Math.min(8,Math.floor(t+1e-6))];}
const VIEWS={persp:[78,72,108],front:[0,24,120],side:[120,24,0],back:[-10,26,-120],top:[0,140,0.01],paso:[75,70,80],flap:[-40,18,25]};
function view(v){const p=VIEWS[v]||VIEWS.persp;const s=EXP?1.35:1;cam.position.set(p[0]*s,p[1]*s,p[2]*s);ctl.target.set(0,v==='top'?0:v==='paso'?8:v==='flap'?10:v==='persp'&&!EXP?H*0.62:H*0.55,v==='flap'?-4:0);ctl.update();

function size(){const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
addEventListener('resize',size);size();
const tEl=document.getElementById('t');let playing=false,last=0;
tEl.oninput=()=>{playing=false;setT(+tEl.value);};
document.getElementById('play').onclick=()=>{playing=!playing;if(playing&&+tEl.value>=8)tEl.value=0;document.getElementById('play').textContent=playing?'Pausa ❚❚':'Armar ▶';};
document.getElementById('exp').onclick=e=>{EXP=!EXP;e.target.classList.toggle('on',EXP);tEl.value=8;setT(8);view('persp');};
document.getElementById('cot').onclick=e=>{COT=!COT;e.target.classList.toggle('on',COT);setT(+tEl.value);};
document.getElementById('eq').onclick=e=>{SHOWEQ=!SHOWEQ;e.target.classList.toggle('on',SHOWEQ);setT(+tEl.value);};
document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>view(b.dataset.v));
const t0=q.get('step')!=null?+q.get('step'):8;tEl.value=t0;setT(t0);view(q.get('view')||'persp');
function loop(ts){const dt=Math.min(0.05,(ts-last)/1000);last=ts;
  if(playing){let t=+tEl.value+dt*0.45;if(t>=8){t=8;playing=false;document.getElementById('play').textContent='Armar ▶';}tEl.value=t;setT(t);}
  ctl.update();renderer.render(scene,cam);window.__ready=true;requestAnimationFrame(loop);}
requestAnimationFrame(loop);
</script>
